<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    try {
      var v = JSON.parse(localStorage.getItem("theme"));
      if (v) document.documentElement.dataset.theme = v;
    } catch (e) {}
  </script>

  <title>VERIFY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =====================================================
       TOKENS (light theme default)
       ===================================================== */
    :root {
      --bg: #f6f2ec;
      --glass: rgba(255, 253, 249, .5);
      --glass2: rgba(255, 255, 255, .58);
      --gb: rgba(255, 255, 255, .7);
      --hl: rgba(255, 255, 255, .9);
      --card: #fffefb;
      --tx: #262428;
      --mut: #6b6670;
      --pri: #262428;
      --pt: #faf8f4;
      --mv: #7a5870;
      --mvs: rgba(122, 88, 112, .12);
      --ln: rgba(38, 36, 40, .12);
      --ln2: rgba(38, 36, 40, .36);
      --ok: #2f6b4c;
      --okb: rgba(47, 107, 76, .12);
      --warn: #8a5a12;
      --warnb: rgba(138, 90, 18, .12);
      --bad: #a23b3b;
      --badb: rgba(162, 59, 59, .11);
      --sh: 0 1px 1px rgba(38, 36, 40, .04), 0 14px 34px -14px rgba(38, 36, 40, .3);
      --blob: rgba(122, 88, 112, .3);
      --blob2: rgba(201, 178, 150, .4);
      --dg: #b83a3a;
      --dgt: #fff;
      --font: "Geist", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }

    /* Dark tokens: follow the system unless the user forced light */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg: #131215;
        --glass: rgba(52, 47, 58, .5);
        --glass2: rgba(70, 63, 78, .5);
        --gb: rgba(255, 255, 255, .12);
        --hl: rgba(255, 255, 255, .18);
        --card: #1d1b20;
        --tx: #ece8e3;
        --mut: #a9a4ae;
        --pri: #ece8e3;
        --pt: #151416;
        --mv: #cfa9c2;
        --mvs: rgba(207, 169, 194, .14);
        --ln: rgba(236, 232, 227, .12);
        --ln2: rgba(236, 232, 227, .4);
        --ok: #6fcf9b;
        --okb: rgba(111, 207, 155, .14);
        --warn: #e5b45c;
        --warnb: rgba(229, 180, 92, .14);
        --bad: #f08f8f;
        --badb: rgba(240, 143, 143, .14);
        --sh: 0 14px 34px -14px rgba(0, 0, 0, .6);
        --blob: rgba(207, 169, 194, .22);
        --blob2: rgba(120, 110, 150, .2);
        color-scheme: dark;
      }
    }

    /* Dark tokens: forced by the toggle */
    :root[data-theme=dark] {
      --bg: #131215;
      --glass: rgba(52, 47, 58, .5);
      --glass2: rgba(70, 63, 78, .5);
      --gb: rgba(255, 255, 255, .12);
      --hl: rgba(255, 255, 255, .18);
      --card: #1d1b20;
      --tx: #ece8e3;
      --mut: #a9a4ae;
      --pri: #ece8e3;
      --pt: #151416;
      --mv: #cfa9c2;
      --mvs: rgba(207, 169, 194, .14);
      --ln: rgba(236, 232, 227, .12);
      --ln2: rgba(236, 232, 227, .4);
      --ok: #6fcf9b;
      --okb: rgba(111, 207, 155, .14);
      --warn: #e5b45c;
      --warnb: rgba(229, 180, 92, .14);
      --bad: #f08f8f;
      --badb: rgba(240, 143, 143, .14);
      --sh: 0 14px 34px -14px rgba(0, 0, 0, .6);
      --blob: rgba(207, 169, 194, .22);
      --blob2: rgba(120, 110, 150, .2);
      color-scheme: dark;
    }

    :root[data-theme=light] {
      color-scheme: light;
    }


    /* =====================================================
       BASE
       ===================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-padding-top: 84px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--tx);
      font: 400 16px/1.5 var(--font);
      padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    /* Soft background blobs */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(closest-side at 15% 8%, var(--blob), transparent 75%),
        radial-gradient(closest-side at 95% 38%, var(--blob2), transparent 75%),
        radial-gradient(closest-side at 10% 85%, var(--blob), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
    }

    :focus-visible {
      outline: 2px solid var(--mv);
      outline-offset: 2px;
    }

    .ic {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hide {
      display: none !important;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 12px;
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.2;
      letter-spacing: -.02em;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    p {
      margin: 0;
    }

    .lead {
      color: var(--mut);
      margin-bottom: 12px;
      max-width: 46ch;
      font-size: .9375rem;
    }

    .mut {
      color: var(--mut);
      font-size: .875rem;
    }


    /* =====================================================
       HEADER
       ===================================================== */
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--glass);
      box-shadow: inset 0 -1px 0 var(--hl);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      border-bottom: 1px solid var(--ln);
    }

    .bar {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: .9375rem;
      min-width: 0;
    }

    .brand span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--mvs);
      color: var(--mv);
      display: grid;
      place-items: center;
      border: 1px solid var(--ln);
      flex: none;
    }

    /* Language switch (EN / TL) */
    .seg {
      display: flex;
      padding: 2px;
      border-radius: 12px;
      background: var(--glass2);
      border: 1px solid var(--ln);
      flex: none;
    }

    .seg button {
      min-width: 40px;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--mut);
    }

    .seg button[aria-pressed=true] {
      background: var(--card);
      color: var(--tx);
      box-shadow: 0 1px 2px rgba(38, 36, 40, .12);
    }

    .act {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Theme toggle button */
    .tb {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--glass2);
      border: 1px solid var(--gb);
      box-shadow: inset 0 1px 0 var(--hl);
    }


    /* =====================================================
       SURFACES
       ===================================================== */
    .card {
      position: relative;
      background: var(--glass);
      border: 1px solid var(--gb);
      border-radius: 18px;
      padding: 12px;
      box-shadow: inset 0 1px 0 var(--hl), var(--sh);
      margin-bottom: 10px;
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 14px auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--hl), transparent);
      pointer-events: none;
    }

    /* Hero: open section on the page background (no card, border or shadow) */
    .hero {
      padding: 36px 4px 24px;
      margin-bottom: 8px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(1.875rem, 7.5vw, 2.5rem);
      line-height: 1.1;
      letter-spacing: -.035em;
      font-weight: 650;
      text-wrap: balance;
    }

    .hero .lead {
      margin: 0 auto 24px;
      max-width: 34ch;
      font-size: 1rem;
      text-wrap: balance;
    }

    .hero form {
      text-align: left;
    }

    .hero .chips {
      justify-content: center;
      margin-top: 14px;
    }

    .hero .note {
      justify-content: center;
      text-align: left;
      margin-top: 14px;
    }

    .hero #scanmsg {
      text-align: center;
    }

    @media (min-width: 900px) {
      .hero {
        padding: 56px 4px 32px;
      }
    }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    /* Fallback when backdrop-filter isn't supported */
    @supports not (backdrop-filter: blur(18px)) {
      .glass,
      .top,
      nav {
        background: var(--card);
      }
    }


    /* =====================================================
       CONTROLS
       ===================================================== */
    .in {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--gb);
      border-radius: 12px;
      background: var(--glass2);
      color: var(--mut);
      box-shadow: inset 0 1px 2px rgba(38, 36, 40, .08);
    }

    .in:focus-within {
      border-color: var(--mv);
      box-shadow: 0 0 0 3px var(--mvs);
    }

    .in input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 0;
      outline: 0;
      background: none;
      color: var(--tx);
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--pri);
      color: var(--pt);
      font-weight: 600;
      font-size: .9375rem;
      text-decoration: none;
      width: 100%;
      margin-top: 6px;
      border: 1px solid transparent;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .row .btn {
      margin: 0;
    }

    .row #go {
      flex: 1;
    }

    .row #scan {
      flex: none;
      width: auto;
    }

    .btn.g {
      background: var(--glass2);
      color: var(--tx);
      border-color: var(--gb);
      box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--ln);
    }

    .btn:active {
      transform: scale(.99);
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .chips:empty {
      display: none;
    }

    .chip {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 99px;
      background: var(--mvs);
      border: 1px solid var(--ln);
      font-size: .8125rem;
    }

    .note {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      color: var(--mut);
      font-size: .8125rem;
    }

    .note .ic {
      width: 16px;
      height: 16px;
      margin-top: 2px;
    }

    /* Camera preview */
    .cam {
      position: relative;
      margin-top: 8px;
    }

    .cam video {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
      display: block;
    }

    .cam::after {
      content: "";
      position: absolute;
      inset: 18% 12%;
      border: 2px solid rgba(255, 255, 255, .85);
      border-radius: 12px;
      pointer-events: none;
    }


    /* =====================================================
       RESULTS
       ===================================================== */
    .verdict {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .vi {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
    }

    .vi .ic {
      width: 24px;
      height: 24px;
    }

    .vt {
      font-size: 1.0625rem;
    }

    .vs {
      color: var(--mut);
      font-size: .875rem;
      margin-top: 2px;
    }

    /* Verdict colours */
    .s-ok .vi   { background: var(--okb);   color: var(--ok); }
    .s-warn .vi { background: var(--warnb); color: var(--warn); }
    .s-bad .vi  { background: var(--badb);  color: var(--bad); }

    .s-ok .vt   { color: var(--ok); }
    .s-warn .vt { color: var(--warn); }
    .s-bad .vt  { color: var(--bad); }

    /* Key/value details list */
    .kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 14px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--ln);
      font-size: .875rem;
    }

    .kv dt {
      color: var(--mut);
    }

    .kv dd {
      margin: 0;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      margin: 10px 6px 0 0;
    }

    .pill.ok   { background: var(--okb);   color: var(--ok); }
    .pill.warn { background: var(--warnb); color: var(--warn); }
    .pill.bad  { background: var(--badb);  color: var(--bad); }

    /* Numbered steps */
    .steps {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }

    .steps li {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--ln);
    }

    .steps li:first-child {
      border: 0;
      padding-top: 0;
    }

    .steps li > div {
      flex: 1;
      min-width: 0;
    }

    .num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--ln2);
      display: grid;
      place-items: center;
      font-size: .8125rem;
      font-weight: 600;
      flex: none;
    }

    #out {
      outline: 0;
    }

    #out > * {
      animation: in .2s ease-out;
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }


    /* =====================================================
       SAVED PRODUCTS
       ===================================================== */
    .item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 0;
      border-top: 1px solid var(--ln);
    }

    .item:first-child {
      border: 0;
    }

    .item > div {
      flex: 1;
      min-width: 0;
    }

    .item .x {
      width: 44px;
      height: 44px;
      margin: -6px -8px 0 0;
      border-radius: 10px;
      color: var(--mut);
      display: grid;
      place-items: center;
    }

    .item .x:hover {
      background: var(--mvs);
    }

    .st {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none;
    }

    .st .ic {
      width: 18px;
      height: 18px;
    }

    /* Add-product form */
    label.f {
      display: block;
      margin-top: 10px;
      font-size: .875rem;
      font-weight: 500;
    }

    .f input,
    .f select {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 4px;
      padding: 0 12px;
      border: 1px solid var(--gb);
      border-radius: 12px;
      background: var(--glass2);
      color: var(--tx);
    }

    .f input:focus,
    .f select:focus {
      outline: 0;
      border-color: var(--mv);
      box-shadow: 0 0 0 3px var(--mvs);
    }

    .f [aria-invalid=true] {
      border-color: var(--bad);
    }


    /* =====================================================
       CHECKLIST
       ===================================================== */
    .ring {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ring circle {
      transition: stroke-dashoffset .4s, stroke .3s;
    }

    .chk {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid var(--ln);
      align-items: center;
      cursor: pointer;
      min-height: 44px;
    }

    .chk:first-child {
      border: 0;
    }

    .chk input {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--ln2);
      border-radius: 7px;
      background: var(--card);
      flex: none;
      display: grid;
      place-content: center;
      margin: 0;
    }

    .chk input:checked {
      background: var(--pri);
      border-color: var(--pri);
    }

    .chk input:checked::after {
      content: "";
      width: 10px;
      height: 6px;
      border: solid var(--pt);
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg) translate(1px, -1px);
    }


    /* =====================================================
       FLOATING NAV & TOASTS
       ===================================================== */
    nav {
      position: fixed;
      z-index: 6;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      width: min(380px, calc(100% - 24px));
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 20px;
      background: var(--glass);
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid var(--gb);
      box-shadow: inset 0 1px 0 var(--hl), 0 12px 32px -12px rgba(0, 0, 0, .4);
    }

    nav button {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-height: 46px;
      border-radius: 16px;
      color: var(--mut);
      font-size: .6875rem;
      font-weight: 500;
    }

    nav button[aria-current=page] {
      background: var(--pri);
      color: var(--pt);
    }

    /* Saved-count badge */
    nav .bd {
      position: absolute;
      top: 4px;
      right: calc(50% - 22px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--mv);
      color: var(--bg);
      font-size: .625rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    #toasts {
      position: fixed;
      z-index: 9;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      width: min(400px, calc(100% - 24px));
      display: grid;
      gap: 8px;
    }

    .toast {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--pri);
      color: var(--pt);
      padding: 10px 10px 10px 16px;
      border-radius: 12px;
      font-size: .875rem;
      box-shadow: var(--sh);
      animation: in .2s;
    }

    .toast button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      font-weight: 600;
      background: rgba(127, 127, 127, .28);
    }

    /* =====================================================
       DESKTOP: nav moves to the top, inline with the header
       (mobile keeps the floating bottom nav above)
       ===================================================== */
    @media (min-width: 900px) {
      body {
        padding-bottom: 32px;
      }

      .bar {
        max-width: 1040px;
        padding: 8px 20px;
      }

      .wrap {
        max-width: 640px;
      }

      nav {
        top: calc(8px + env(safe-area-inset-top, 0px));
        bottom: auto;
        width: auto;
        gap: 4px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      nav button {
        flex: none;
        flex-direction: row;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        font-size: .875rem;
      }

      nav button:not([aria-current=page]):hover {
        background: var(--glass2);
        color: var(--tx);
      }

      nav .bd {
        position: static;
      }

      #toasts {
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
    }


    /* Saved products: toolbar, table, row menu, modal */
    .tbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }

    table.pt { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .875rem; }
    table.pt.e { min-width: 0; }
    .pt th { text-align: left; font-size: .75rem; font-weight: 600; color: var(--mut); padding: 6px 10px 8px; white-space: nowrap; border-bottom: 1px solid var(--ln); }
    .pt td { padding: 10px; border-top: 1px solid var(--ln); vertical-align: middle; overflow-wrap: anywhere; }
    .pt tbody tr:first-child td { border-top: 0; }
    .pt td.pn { min-width: 150px; }
    .pt td.pn b { display: block; }
    .pt .pill { margin: 0; white-space: nowrap; }
    .pt th.act, .pt td.act { width: 48px; padding-right: 0; text-align: right; }

    .pt .empty td { border: 0; padding: 32px 12px; text-align: center; }

    .emp .eic { width: 48px; height: 48px; border-radius: 14px; background: var(--mvs); color: var(--mv); display: grid; place-items: center; }
    .emp .btn { width: auto; margin-top: 8px; padding: 0 16px; }

    .menu { position: fixed; z-index: 60; min-width: 168px; padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--ln); box-shadow: var(--sh); animation: in .15s; }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border-radius: 10px; font-size: .9rem; font-weight: 500; text-align: left; }

    .menu .dng { color: var(--bad); }

    dialog.md { border: 1px solid var(--gb); border-radius: 20px; padding: 0; background: var(--card); color: var(--tx); width: min(480px, calc(100% - 24px)); max-height: calc(100dvh - 24px); box-shadow: var(--sh), 0 30px 80px -20px rgba(0, 0, 0, .45); overflow: hidden; }
    dialog.md[open] { display: flex; flex-direction: column; animation: in .2s; }
    dialog.md::backdrop { background: rgba(20, 18, 22, .5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .md form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .mh { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 0 18px; }
    .mh h2 { margin: 0; }
    .mh .x { width: 40px; height: 40px; border-radius: 10px; color: var(--mut); display: grid; place-items: center; }
    .mh .x:hover { background: var(--mvs); }
    .mb { padding: 0 18px 8px; overflow-y: auto; }
    .mf { display: flex; gap: 8px; padding: 12px 18px 18px; }
    .mf .btn { margin: 0; flex: 1; }
    .fr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fr .f, .fr input, .fr select { min-width: 0; max-width: 100%; }
    @media (max-width: 340px) { .fr { grid-template-columns: 1fr; gap: 0; } }
    .ferr { display: block; margin-top: 4px; font-size: .8125rem; color: var(--bad); }
  
    /* Alert dialog (shadcn-style): confirm before delete / update */
    @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(4px); } }
    dialog.md.al { width: min(440px, calc(100% - 24px)); border-radius: 16px; overflow: visible; }
    dialog.md.al[open] { display: grid; gap: 20px; padding: 22px; animation: pop .16s ease-out; }
    dialog.md.al::backdrop { animation: in .16s ease-out; }
    .alh { display: flex; gap: 14px; align-items: flex-start; }
    .alh h2 { font-size: 1.0625rem; letter-spacing: -.01em; line-height: 1.3; }
    .alh p { margin-top: 6px; line-height: 1.5; }
    .alh p b { color: var(--tx); font-weight: 600; overflow-wrap: anywhere; }
    .alic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
    .alic.bad { background: var(--badb); color: var(--bad); }
    .alic.mv { background: var(--mvs); color: var(--mv); }
    .alf { display: flex; justify-content: flex-end; gap: 8px; }

    .btn.dg { background: var(--dg); color: var(--dgt); }

    @media (max-width: 480px) {
      .alf { flex-direction: column-reverse; }

    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    /* =====================================================
       STATE
       ===================================================== */
    let lang = sg("lang", "en");              // current language
    let reg  = [];                            // saved products (loaded from IndexedDB)
    let ready = false;                        // true once the database has loaded
    let rec  = sg("rec", []);                 // recent searches (max 4)

    /* =====================================================
       DATABASE (IndexedDB, with localStorage fallback)
       Store "products": { id (auto), ts, n, b, c, f, s, e }
       ===================================================== */
    const DB = (() => {
      let db = null;
      let mem = [];   // only used when IndexedDB is unavailable

      const run = (mode, fn) => new Promise((res, rej) => {
        const tx = db.transaction("products", mode);
        const rq = fn(tx.objectStore("products"));
        tx.oncomplete = () => res(rq.result);
        tx.onerror = tx.onabort = () => rej(tx.error);
      });

      return {
        // Open the database, move old localStorage data over once, return all rows
        async init() {
          const legacy = sg("reg2", []).map((r, i) => ({ ...r, ts: r.ts || Date.now() - i }));
          try {
            db = await new Promise((res, rej) => {
              if (!window.indexedDB) return rej();
              const rq = indexedDB.open("ph-beauty-checker", 1);
              rq.onupgradeneeded = () =>
                rq.result.createObjectStore("products", { keyPath: "id", autoIncrement: true });
              rq.onsuccess = () => res(rq.result);
              rq.onerror = rq.onblocked = () => rej(rq.error);
            });

            if (legacy.length) {
              if (!(await run("readonly", s => s.count()))) {
                for (const r of legacy) {
                  delete r.id;
                  await run("readwrite", s => s.add(r));
                }
              }
              try { localStorage.removeItem("reg2"); } catch (e) {}
            }
            return await run("readonly", s => s.getAll());
          } catch (e) {
            db = null;
            mem = legacy.map((r, i) => ({ ...r, id: r.id || i + 1 }));
            return [...mem];
          }
        },

        // Create or update (update when item.id exists)
        async put(item) {
          if (db) {
            item.id = await run("readwrite", s => s.put(item));
            return item;
          }
          if (!item.id) item.id = mem.reduce((m, r) => Math.max(m, r.id), 0) + 1;
          const i = mem.findIndex(r => r.id === item.id);
          i >= 0 ? (mem[i] = item) : mem.push(item);
          ss("reg2", mem);
          return item;
        },

        async del(id) {
          if (db) return run("readwrite", s => s.delete(id));
          mem = mem.filter(r => r.id !== id);
          ss("reg2", mem);
        }
      };
    })();

    const byNew = (a, b) => b.ts - a.ts;

    // Save (add or update) a product, then refresh the UI
    async function saveItem(item) {
      try {
        await DB.put(item);
      } catch (e) {
        toast(t("dbErr"));
        return false;
      }
      const i = reg.findIndex(r => r.id === item.id);
      i >= 0 ? (reg[i] = item) : reg.push(item);
      reg.sort(byNew);
      refresh();
      return true;
    }

    /* =====================================================

       ===================================================== */
    function score() {
      const n = ck.filter(Boolean).length;

      // 1 = good, 2 = careful, 3 = not enough
      const k = (n >= 7 && ck[0] && ck[1] && ck[2]) ? 1
              : (n >= 5) ? 2
              : 3;

      const color = ["", "var(--ok)", "var(--warn)", "var(--bad)"][k];

      $("arc").style.strokeDashoffset = 214 - 214 * n / 8;
      $("arc").style.stroke = color;
      $("num").textContent = Math.round(n / 8 * 100) + "%";
      $("stt").textContent = t("c" + k);
      $("sts").textContent = t("c" + k + "s");
    }

    $("chks").onchange = e => {

    /* =====================================================
       MARKETPLACE LINK CHECKER
       Detects supported marketplace URLs and prepares official-source research.
       Live listing extraction requires authorized marketplace APIs/backend access.
       ===================================================== */
    const detectMarketplace = raw => {
      let u;
      try { u = new URL(raw); } catch (_) { return null; }
      if (!/^https?:$/.test(u.protocol)) return null;
      const host = u.hostname.toLowerCase().replace(/^www\./, '');
      if (/(^|\.)shopee\.(ph|com|vn|co\.id|co\.th|com\.my|sg)$/.test(host) || host === 'shopee.ph') return {name:'Shopee', host};
      if (/(^|\.)lazada\.(com\.ph|com|vn|co\.id|co\.th|com\.my|sg)$/.test(host)) return {name:'Lazada', host};
      if (/(^|\.)tiktok\.com$/.test(host) || host === 'vt.tiktok.com') return {name:'TikTok Shop / TikTok', host};
      return null;
    };
    const productHintFromUrl = raw => {
      const u = new URL(raw);
      let parts = u.pathname.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (_) { return x; } });
      const ignored = /^(product|products|item|shop|mall|view|share|index|goods|p)$/i;
      parts = parts.filter(x => !ignored.test(x) && !/^\d{6,}$/.test(x));
      let hint = parts.filter(x => /[a-z]/i.test(x)).slice(-3).join(' ');
      hint = hint.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
      return hint || '';
    };
    const searchUrl = q => 'https://www.google.com/search?q=' + encodeURIComponent(q);
    $("demoForm").onsubmit = e => {
      e.preventDefault();
      const raw = $("listingUrl").value.trim();
      const platform = detectMarketplace(raw);
      const result = $("demoResult");
      if (!platform) {
        $("linkStatus").textContent = 'Unsupported link. Please paste a valid Shopee, Lazada, or TikTok Shop URL.';
        result.innerHTML = '';
        return;
      }
      const hint = productHintFromUrl(raw);
      const officialQuery = hint ? 'official brand website ' + hint : 'official brand product website';
      const officialSearch = searchUrl(officialQuery);
      $("linkStatus").textContent = platform.name + ' link detected.';
      result.innerHTML = `
        <article class="card" style="margin-top:12px;display:grid;gap:12px">
          <div><span class="tag">${esc(platform.name)} detected</span><h2 style="margin-top:8px">Listing link received</h2>
            <p class="mut">${hint ? 'Possible product name from the URL: <strong>' + esc(hint) + '</strong>' : 'The URL does not contain a readable product name.'}</p>
          </div>
          <div class="demo-grid">
            <div><div class="demo-placeholder" style="aspect-ratio:16/9">Marketplace listing</div><a class="btn g" href="${esc(raw)}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:8px">Open ${esc(platform.name)} listing</a></div>
            <div><div class="demo-placeholder" style="aspect-ratio:16/9">Official source search</div><a class="btn g" href="${esc(officialSearch)}" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:8px">Search official product source</a></div>
          </div>
          <div id="linkAi" aria-live="polite"></div>
          <p class="mut">VERIFY can't read the marketplace listing itself, because these pages restrict outside access. The comparison above is based on the product name in the link and on general web information. It does not say whether this listing or seller is authentic.</p>
          <a class="mut" href="https://verification.fda.gov.ph" target="_blank" rel="noopener">Verify cosmetic product notification on the Philippine FDA portal</a>
        </article>`;
      result.scrollIntoView({behavior:'smooth', block:'nearest'});
      linkCompare(raw, hint, platform.name);
    };

    // Authentic vs mimic comparison (optional, powered by the backend / Gemini).
    // The listing itself is never judged: this explains what the official product looks like.
    let linkSeq = 0;
    async function linkCompare(url, hint, platform) {
      const box = $("linkAi");
      if (!box) return;
      const mine = ++linkSeq;
      box.innerHTML = '<p class="mut">Looking up the official product and how to tell it apart from fakes...</p>';
      try {
        const res = await fetch("/api/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, hint, platform, lang })
        });
        if (!res.ok) throw new Error("bad status");
        const d = await res.json();
        if (mine !== linkSeq || !$("linkAi")) return;

        const rows = (d.compare || []).map(r => `
          <div style="margin-top:10px">
            <b>${esc(r.aspect)}</b>
            <div class="demo-grid" style="margin-top:4px">
              <div class="card s-ok" style="margin:0;padding:10px"><span class="pill ok" style="margin:0 0 6px">Authentic</span><p style="font-size:.875rem">${esc(r.authentic)}</p></div>
              <div class="card s-bad" style="margin:0;padding:10px"><span class="pill bad" style="margin:0 0 6px">Dupe / mimic</span><p style="font-size:.875rem">${esc(r.mimic)}</p></div>
            </div>
          </div>`).join("");

        const ing = (d.ingredients || []).length
          ? `<p style="margin-top:10px"><b>Ingredients (official sources)</b></p><p class="mut">${d.ingredients.map(esc).join(", ")}</p>
             <p class="mut" style="font-size:.8125rem">Compare with the printed label on the product you receive.</p>`
          : `<p class="mut" style="margin-top:10px">No ingredient list was found from official sources. Check the printed label and the brand's official website.</p>`;

        const src = (d.sources || []).filter(x => /^https:\/\//.test(x.url)).map(x =>
          `<a class="mut" style="display:block;margin-top:4px" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">${esc(x.title || x.url)}</a>`).join("");

        box.innerHTML = `
          <div>
            <h3 style="font-size:1rem">${d.identified ? esc([d.brand, d.product].filter(Boolean).join(" ")) : "Product could not be identified from the link"}</h3>
            ${d.size ? `<p class="mut">Size: ${esc(d.size)}</p>` : ""}
            ${d.officialWhere ? `<p class="mut">Officially sold: ${esc(d.officialWhere)}</p>` : ""}
            ${d.whyAuthentic ? `<div class="card s-ok" style="margin:10px 0 0;padding:10px"><b>Why the official product is the legitimate one</b><p style="font-size:.875rem;margin-top:4px">${esc(d.whyAuthentic)}</p></div>` : ""}
            ${d.whyMimic ? `<div class="card s-bad" style="margin:10px 0 0;padding:10px"><b>Why dupes and mimics are not legitimate</b><p style="font-size:.875rem;margin-top:4px">${esc(d.whyMimic)}</p></div>` : ""}
            ${rows}
            ${ing}
            ${src ? `<p class="mut" style="margin-top:10px">Sources</p>${src}` : ""}
          </div>`;
      } catch (e) {
        if (mine === linkSeq && $("linkAi")) {
          $("linkAi").innerHTML = '<p class="mut">The comparison needs the VERIFY server. Run it with npm start and open the localhost address.</p>';
        }
      }
    }

    /* =====================================================
       SAVED PRODUCTS
       ===================================================== */
    // status -> [colour class, icon, title key, subtitle key]
    const ST = {
      registered: ["ok",   "shield",  "v_ok",  "v_okS"],
      banned:     ["bad",  "shieldx", "v_bad", "v_badS"],
      expired:    ["warn", "clock",   "v_wn",  "v_wnS"]
    };

    function refresh() {
      renderList();

      const badge = $("bd");
      badge.textContent = reg.length;
      badge.classList.toggle("hide", !reg.length);

      if (view) renderResult();
    }

    let editing = -1;   // index being edited, -1 = adding
    let menu = null;    // open row menu

    function renderList() {
      closeMenu();
      if (!ready) { $("list").innerHTML = ""; $("cnt").textContent = ""; return; }
      $("cnt").textContent = reg.length + " " + t("prods");

      const rows = reg.map((r, i) => {
        const m = ST[r.s] || ST.registered;
        return `
          <tr>
            <td class="pn"><b>${esc(r.n)}</b><div class="mut">${esc(r.b || "—")}</div></td>
            <td>${esc(r.c || "—")}</td>
            <td>${esc(r.f || "—")}</td>
            <td><span class="pill ${m[0]}">${t(r.s)}</span></td>
            <td>${esc(fd(r.e) || "—")}</td>
            <td class="act">
              <button class="more" type="button" data-m="${i}" aria-haspopup="menu" aria-expanded="false"
                aria-label="${esc(t("more"))} ${esc(r.n)}">${I("dots")}</button>
            </td>
          </tr>`;
      }).join("");

      const empty = `
        <tr class="empty"><td colspan="6">
          <div class="emp">
            <span class="eic">${I("bm")}</span>
            <b>${t("emptyT")}</b>
            <span class="mut">${t("empty")}</span>
            <button class="btn" type="button" data-add>${I("plus")}${t("addBtn")}</button>
          </div>
        </td></tr>`;

      $("list").innerHTML = `
        <table class="pt${reg.length ? "" : " e"}">
          <thead><tr>
            <th>${t("pr")}</th><th>${t("bc")}</th><th>${t("fda")}</th><th>${t("fS")}</th><th>${t("ex")}</th>
            <th class="act"><span class="sr">${t("more")}</span></th>
          </tr></thead>
          <tbody>${reg.length ? rows : empty}</tbody>
        </table>`;
    }

    /* ---- Row menu (ellipsis) ---- */
    function closeMenu() {
      if (!menu) return;
      menu.remove();
      menu = null;
      document.querySelectorAll("[data-m][aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false"));
    }

    function openMenu(btn) {
      closeMenu();
      const i = +btn.dataset.m;
      menu = document.createElement("div");
      menu.className = "menu";
      menu.setAttribute("role", "menu");
      menu.innerHTML = `
        <button type="button" role="menuitem" data-a="edit">${I("edit")}${t("edit")}</button>
        <button type="button" role="menuitem" data-a="del" class="dng">${I("trash")}${t("del")}</button>`;
      document.body.appendChild(menu);

      const r = btn.getBoundingClientRect();
      const w = menu.offsetWidth, h = menu.offsetHeight;
      menu.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
      menu.style.top = (r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + "px";
      btn.setAttribute("aria-expanded", "true");
      menu.querySelector("button").focus();

      menu.onclick = e => {
        const a = e.target.closest("[data-a]");
        if (!a) return;
        closeMenu();
        a.dataset.a === "edit" ? openModal(i) : delItem(i);
      };
    }

    $("list").onclick = e => {
      const b = e.target.closest("[data-m]");
      if (b) {
        e.stopPropagation();
        b.getAttribute("aria-expanded") === "true" ? closeMenu() : openMenu(b);
      } else if (e.target.closest("[data-add]")) {
        openModal(-1);
      }
    };

    document.addEventListener("click", e => {
      if (menu && !menu.contains(e.target)) closeMenu();
    });

    document.addEventListener("keydown", e => {
      if (!menu) return;
      if (e.key === "Escape") {
        const b = document.querySelector("[data-m][aria-expanded=true]");
        closeMenu();
        b && b.focus();
      } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const items = [...menu.querySelectorAll("button")];
        const n = items.indexOf(document.activeElement) + (e.key === "ArrowDown" ? 1 : -1);
        items[(n + items.length) % items.length].focus();
      }
    });

    addEventListener("scroll", closeMenu, true);
    addEventListener("resize", closeMenu);

    /* ---- Alert dialog: resolves true on confirm, false on cancel / Esc ---- */
    const al = $("al");

    function ask(kind, name) {
      const del = kind === "del";
      $("alic").className = "alic " + (del ? "bad" : "mv");
      $("alic").innerHTML = I(del ? "trash" : "edit");
      $("alt").textContent = t(del ? "delT" : "updT");

      const [a, b] = t(del ? "delD" : "updD").split("{n}");
      const strong = document.createElement("b");
      strong.textContent = "\u201C" + name + "\u201D";
      $("ald").replaceChildren(a, strong, b || "");

      $("alc").textContent = t("cancel");
      $("alo").textContent = t(del ? "delA" : "updA");
      $("alo").className = "btn" + (del ? " dg" : "");

      return new Promise(res => {
        al.returnValue = "";
        al.onclose = () => res(al.returnValue === "ok");
        al.showModal();
        $("alc").focus();   // safe default: Cancel
      });
    }

    $("alc").onclick = () => al.close("cancel");
    $("alo").onclick = () => al.close("ok");

    /* ---- Delete (confirm, then Undo toast) ---- */
    async function delItem(i) {
      const item = reg[i];

      if (!(await ask("del", item.n))) {
        const b = document.querySelector(`[data-m="${i}"]`);
        b && b.focus();
        return;
      }

      try {
        await DB.del(item.id);
      } catch (e) {
        toast(t("dbErr"));
        return;
      }
      reg.splice(i, 1);
      refresh();
      toast(t("deleted"), () => saveItem(item));
    }

    /* ---- Add / Edit modal ---- */
    const dlg = $("dlg");

    function modalText() {
      $("mt").textContent = t(editing >= 0 ? "editT" : "addT");
      $("sub").textContent = t(editing >= 0 ? "upd" : "add");
    }

    function openModal(i) {
      editing = i;
      const r = i >= 0 ? reg[i] : { n: "", b: "", c: "", f: "", s: "registered", e: "" };
      $("fn").value = r.n;
      $("fb").value = r.b || "";
      $("fc").value = r.c || "";
      $("ff").value = r.f || "";
      $("fs").value = r.s || "registered";
      $("fe").value = r.e || "";
      $("fn").removeAttribute("aria-invalid");
      $("fnerr").classList.add("hide");
      modalText();
      dlg.showModal();
      $("fn").focus();
    }

    $("addb").onclick = () => openModal(-1);
    $("mx").onclick = $("cancel").onclick = () => dlg.close();

    // Close when clicking the dimmed backdrop (not when a drag ends there)
    let downOnBackdrop = false;
    dlg.addEventListener("mousedown", e => { downOnBackdrop = e.target === dlg; });
    dlg.addEventListener("click", e => { if (e.target === dlg && downOnBackdrop) dlg.close(); });

    $("af").onsubmit = e => {
      e.preventDefault();

      const name = $("fn").value.trim();
      $("fn").setAttribute("aria-invalid", !name);
      $("fnerr").classList.toggle("hide", !!name);
      if (!name) { $("fn").focus(); return; }

      const i = editing;
      const item = {
        ...(i >= 0 ? reg[i] : { ts: Date.now() }),
        n: name,
        b: $("fb").value.trim(),
        c: $("fc").value.replace(/[\s-]/g, ""),
        f: $("ff").value.trim(),
        s: $("fs").value,
        e: $("fe").value
      };

      const commit = () => saveItem(item).then(ok => {
        if (!ok) return;
        dlg.close();
        toast(t(i >= 0 ? "updated" : "saved"));
        if (i >= 0) { const b = document.querySelector(`[data-m="${i}"]`); b && b.focus(); }
      });

      // Editing an existing product asks for confirmation first
      if (i >= 0) {
        ask("upd", reg[i].n).then(yes => yes && commit());
      } else {
        commit();
      }
    };


    /* =====================================================
       RECENT SEARCHES
       ===================================================== */
    function renderRec() {
      $("recent").innerHTML = rec.length
        ? `<span class="mut">${t("rc")}</span>` +
          rec.map(r => `<button type="button" class="chip" data-r="${esc(r)}">${esc(r)}</button>`).join("")
        : "";
    }

    $("recent").onclick = e => {
      const r = e.target.closest("[data-r]");
      if (r) {
        $("q").value = r.dataset.r;
        run();
      }
    };


    /* =====================================================
       SEARCH & RESULTS
       ===================================================== */
    // Validate an EAN-8 / UPC-A / EAN-13 barcode
    function ean(code) {
      if (!/^\d{8}$|^\d{12,13}$/.test(code)) return null;

      const padded = code.padStart(13, "0");
      const digits = [...padded].map(Number);
      const sum = digits
        .slice(0, 12)
        .reduce((total, d, i) => total + d * (i % 2 ? 3 : 1), 0);

      return {
        valid: (10 - sum % 10) % 10 === digits[12],
        ph: padded.slice(0, 3) === "480"
      };
    }

    // Lowercase, strip symbols, collapse spaces
    const norm = s => String(s || "")
      .toLowerCase()
      .replace(/[^a-z0-9 ]/g, " ")
      .replace(/\s+/g, " ")
      .trim();

    // Find saved products that match the query
    const find = q => {
      const n = norm(q);
      if (n.length < 2) return [];

      const words = n.split(" ");

      return reg.filter(r => {
        const haystack = norm([r.n, r.b, r.f, r.c].join(" "));
        return haystack.includes(n) || words.every(w => haystack.includes(w));
      });
    };

    // Verdict header (icon + title + subtitle)
    const head = (icon, title, sub) => `
      <div class="verdict">
        <span class="vi">${I(icon)}</span>
        <div>
          <h2 class="vt">${title}</h2>
          <p class="vs">${sub}</p>
        </div>
      </div>`;

    // Result card for one saved product
    function card(r, n, code) {
      const m = ST[r.s] || ST.registered;

      const exact =
        norm(r.n) === n ||
        (r.f && norm(r.f) === n) ||
        (r.c && r.c === code);

      const past =
        r.s === "registered" &&
        r.e &&
        r.e < new Date().toLocaleDateString("en-CA");

      return `
        <article class="card s-${m[0]}">
          ${head(m[1], t(m[2]), t(m[3]))}
          <dl class="kv">
            <dt>${t("pr")}</dt><dd><b>${esc(r.n)}</b></dd>
            <dt>${t("br")}</dt><dd>${esc(r.b || "-")}</dd>
            ${r.c ? `<dt>${t("bc")}</dt><dd>${esc(r.c)}</dd>` : ""}
            <dt>${t("fda")}</dt><dd>${esc(r.f || t("none"))}</dd>
            <dt>${t("ex")}</dt><dd>${esc(fd(r.e) || "-")}</dd>
          </dl>
          ${exact ? "" : `<span class="pill warn">${I("info")}${t("pm")}</span>`}
          ${past ? `<span class="pill bad">${I("clock")}${t("exPast")}</span>` : ""}
        </article>`;
    }

    function renderResult() {
      const q    = view.q;
      const n    = norm(q);
      const code = q.replace(/[\s-]/g, "");
      const b    = ean(code);
      const hits = [...new Set(find(q).concat(b ? find(code) : []))];

      let html = "";

      if (view.nf) {
        // User said it's NOT on the FDA portal
        html = `
          <article class="card s-bad">
            ${head("shieldx", t("nfT"), t("nfS"))}
            <a class="btn g" target="_blank" rel="noopener" href="https://www.fda.gov.ph/">
              ${t("repB")}${I("ext")}
            </a>
          </article>`;
      } else if (hits.length) {
        // Matches in saved products
        html = hits.map(r => card(r, n, code)).join("");
      } else {
        // Nothing found
        html = `
          <article class="card s-warn">
            ${head("help", t("v_un"), t("v_unS"))}
            ${b ? `
              <span class="pill ${b.valid ? "ok" : "bad"}">${t(b.valid ? "bOk" : "bBad")}</span>
              ${code.length >= 12
                ? `<span class="pill ${b.ph ? "ok" : "warn"}">${t(b.ph ? "bPH" : "bImp")}</span>`
                : ""}
              <p class="mut" style="margin-top:10px">${t("bNote")}</p>`
              : ""}
          </article>`;
      }

      // Optional smart-search info (filled in by the backend; empty if unavailable)
      html += `<div id="ai">${aiHtml()}</div>`;

      // Verify-with-FDA steps
      html += `
        <section class="card">
          <h2>${t("vf")}</h2>
          <ol class="steps">
            <li>
              <span class="num">1</span>
              <div>
                <b>${t("s1")}</b>
                <p class="mut">${esc(q)}</p>
                <button class="btn g" id="cp" type="button">${I("copy")}${t("cp")}</button>
              </div>
            </li>
            <li>
              <span class="num">2</span>
              <div>
                <b>${t("s2")}</b>
                <a class="btn" target="_blank" rel="noopener" href="https://verification.fda.gov.ph/">
                  ${t("p1")}${I("ext")}
                </a>
              </div>
            </li>
            <li>
              <span class="num">3</span>
              <div>
                <b>${t("s3")}</b>
                <a class="btn g" target="_blank" rel="noopener" href="https://www.fda.gov.ph/advisories/">
                  ${t("p2")}${I("ext")}
                </a>
              </div>
            </li>
            ${hits.length || view.nf ? "" : `
            <li>
              <span class="num">4</span>
              <div>
                <b>${t("ask")}</b>
                <button class="btn" id="yes" type="button">${I("check")}${t("yes")}</button>
                <button class="btn g" id="no" type="button">${I("x")}${t("no")}</button>
              </div>
            </li>`}
          </ol>
        </section>`;

      $("out").innerHTML = html;

      // Screen-reader announcement
      $("sr").textContent = view.nf
        ? t("nfT")
        : hits.length
          ? t(ST[hits[0].s || "registered"][2])
          : t("v_un");

      // Copy button
      $("cp").onclick = () => {
        try {
          navigator.clipboard.writeText(q).then(
            () => toast(t("copied")),
            () => toast(t("noCopy"))
          );
        } catch (e) {
          toast(t("noCopy"));
        }
      };

      // "Yes, it's there" -> save the product
      if ($("yes")) {
        $("yes").onclick = () => {
          if (b) {
            // It's a barcode: go to the form with the barcode filled in
            tab("saved");
            openModal(-1);
            $("fc").value = code;
            return;
          }

          saveItem({ n: q, b: "", f: "", c: "", s: "registered", e: "", ts: Date.now() })
            .then(ok => ok && toast(t("fnd")));
        };
      }

      // "No, not found" -> show the warning card
      if ($("no")) {
        $("no").onclick = () => {
          view.nf = true;
          renderResult();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      }
    }

    // Smart search: asks the backend (which talks to Gemini) to understand the query.
    // Optional enhancement. If it fails, the rest of the app behaves exactly as before.
    const aiRow = (label, value) =>
      value ? `<dt>${t(label)}</dt><dd>${esc(value)}</dd>` : "";

    function aiHtml() {
      const a = view && view.ai;
      if (!a) return "";

      if (a.loading) {
        return `<section class="card" aria-busy="true"><p class="mut">${t("aiLoad")}</p></section>`;
      }

      const d = a.data;
      if (!d) return "";

      const points = (d.points || []).map(p => `<li>${esc(p)}</li>`).join("");
      const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
      const sources = (d.sources || [])
        .filter(x => /^https:\/\//.test(x.url))
        .map(x => `
          <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" style="display:block;margin-top:10px;color:inherit;text-decoration:none">
            <span class="mut" style="font-size:.75rem">${esc(host(x.url))}</span><br>
            <b style="text-decoration:underline">${esc(x.title || host(x.url) || x.url)}</b>
            ${x.snippet ? `<span class="mut" style="display:block;font-size:.875rem">${esc(x.snippet)}</span>` : ""}
          </a>`)
        .join("");
      const stores = (d.stores || []).map(x => `
        <dt>${esc(x.name)}</dt><dd>${x.type ? `<b>${esc(x.type)}</b>. ` : ""}${esc(x.note || "")}</dd>`).join("");

      return `
        <section class="card">
          <div class="verdict">
            <span class="vi" style="background:var(--ln);color:var(--mut)">${I("search")}</span>
            <div>
              <h2 class="vt">${t("aiT")}</h2>
              <p class="vs">${esc(d.summary || "")}</p>
            </div>
          </div>
          <dl class="kv">
            ${aiRow("aiProd", [d.brand, d.product].filter(Boolean).join(" "))}
            ${aiRow("aiCat", d.category)}
            ${aiRow("aiFda", d.fdaSearch)}
          </dl>
          ${points ? `<ul class="mut" style="margin:10px 0 0;padding-left:18px">${points}</ul>` : ""}
          ${stores ? `<h3 style="margin-top:14px;font-size:.9375rem">${t("aiStores")}</h3><dl class="kv">${stores}</dl><p class="mut" style="margin-top:8px;font-size:.8125rem">${t("aiStoresNote")}</p>` : ""}
          ${sources ? `<h3 style="margin-top:14px;font-size:.9375rem">${t("aiSrc")}</h3>${sources}` : ""}
          <p class="mut" style="margin-top:10px">${t("aiNote")}</p>
        </section>`;
    }

    async function smartSearch(q) {
      const code = q.replace(/[\s-]/g, "");
      // Plain barcodes / numbers are handled by the existing checks, no need for the backend
      if (q.length < 3 || /^\d+$/.test(code)) return;

      const mine = view;
      mine.ai = { loading: true };
      if ($("ai")) $("ai").innerHTML = aiHtml();

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: q, lang })
        });
        if (!res.ok) throw new Error("bad status");
        const data = await res.json();
        mine.ai = { data };
      } catch (e) {
        mine.ai = null;   // fail silently: the normal result is already on screen
      }

      // Only update the screen if the user hasn't started another search meanwhile
      if (view === mine && $("ai")) $("ai").innerHTML = aiHtml();
    }

    // Run a search from the input box
    function run() {
      const q = $("q").value.trim();

      if (!q) {
        toast(t("typeFirst"));
        $("q").focus();
        return;
      }

      rec = [q, ...rec.filter(x => x !== q)].slice(0, 4);
      ss("rec", rec);
      renderRec();

      view = { q, nf: false };
      renderResult();
      smartSearch(q);

      $("out").focus({ preventScroll: true });
      $("out").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("sf").onsubmit = e => {
      e.preventDefault();
      run();
    };


    /* =====================================================
       BARCODE SCANNER
       ===================================================== */
    let stream = null;
    let timer  = null;
    let busy   = false;

    // Stop the camera and reset the scan UI
    function halt() {
      clearInterval(timer);
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      busy = false;

      $("cam").classList.add("hide");
      $("stop").classList.add("hide");
      $("scan").classList.remove("hide");
      $("scanmsg").textContent = "";
    }

    $("stop").onclick = halt;

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) halt();
    });

    $("scan").onclick = async () => {
      const msg = $("scanmsg");

      // Browser doesn't support BarcodeDetector
      if (!("BarcodeDetector" in window)) {
        msg.textContent = t("noScan");
        $("q").focus();
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        const video = $("vid");
        video.srcObject = stream;
        await video.play();

        $("cam").classList.remove("hide");
        $("stop").classList.remove("hide");
        $("scan").classList.add("hide");
        msg.textContent = t("aim");

        // Use only the barcode formats this browser supports
        let formats = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "qr_code"];
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          formats = formats.filter(f => supported.includes(f));
        } catch (e) {}

        const detector = new BarcodeDetector(formats.length ? { formats } : undefined);

        // Check the camera feed every 400ms
        timer = setInterval(async () => {
          if (busy) return;
          busy = true;

          try {
            const results = await detector.detect(video);
            if (results.length) {
              $("q").value = results[0].rawValue;
              halt();
              toast(t("scanned"));
              run();
            }
          } catch (e) {}

          busy = false;
        }, 400);

      } catch (e) {
        halt();
        msg.textContent = t("noCam");
        $("q").focus();
      }
    };


    /* =====================================================
       INIT
       ===================================================== */
    apply();
    DB.init().then(rows => {
      reg = rows.sort(byNew);
      ready = true;
      refresh();
    });
  </script>

</body>
</html>
